# Staging Environment Configuration
# AI-Native PaaS Platform

platform:
  name: "AI-Native PaaS"
  version: "1.0.0"
  environment: "staging"
  debug: false
  log_level: "INFO"

# Database Configuration
database:
  url: "${DATABASE_URL}"  # From environment variable
  pool_size: 20
  max_overflow: 30
  echo: false

# Redis Configuration
redis:
  url: "${REDIS_URL}"
  max_connections: 20
  decode_responses: true

# AWS Configuration
aws:
  region: "${AWS_REGION}"
  account_id: "${AWS_ACCOUNT_ID}"
  mock_mode: false
  
  # ECS Configuration
  ecs:
    cluster_name: "paas-staging-cluster"
    task_definition_family: "paas-staging-app"
    service_name_prefix: "paas-staging"
    cpu: 1024
    memory: 2048
    
  # DynamoDB Configuration
  dynamodb:
    table_prefix: "paas-staging"
    billing_mode: "PAY_PER_REQUEST"
    point_in_time_recovery: true
    
  # S3 Configuration
  s3:
    bucket_name: "paas-staging-storage"
    versioning: true
    encryption: true
    
  # SageMaker Configuration
  sagemaker:
    endpoint_scaling: "paas-staging-scaling-predictor"
    endpoint_anomaly: "paas-staging-anomaly-detector"
    endpoint_cost: "paas-staging-cost-optimizer"
    instance_type: "ml.t3.medium"

# Scaling Configuration
scaling:
  strategy: "predictive"
  min_instances: 2
  max_instances: 50
  ai_confidence_threshold: 0.8
  scale_up_cooldown: 180  # 3 minutes
  scale_down_cooldown: 300  # 5 minutes
  
  # Metrics thresholds
  cpu_threshold_up: 75.0
  cpu_threshold_down: 25.0
  memory_threshold_up: 85.0
  memory_threshold_down: 35.0
  
  # Predictive scaling
  prediction_window_minutes: 30
  historical_data_days: 7

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_retention_days: 30
  anomaly_detection_enabled: true
  alerting_enabled: true
  
  # Metrics collection interval
  collection_interval_seconds: 30
  
  # Dashboard configuration
  dashboards:
    enabled: true
    refresh_interval: 15
    
  # Alerting thresholds
  alerts:
    error_rate_threshold: 5.0
    response_time_threshold: 2000  # 2 seconds
    memory_usage_threshold: 90.0
    cpu_usage_threshold: 85.0

# Security Configuration
security:
  encryption_at_rest: true
  encryption_in_transit: true
  rbac_enabled: true
  audit_logging: true
  
  # JWT Configuration
  jwt:
    secret_key: "${JWT_SECRET_KEY}"
    algorithm: "HS256"
    expiration_hours: 8
    
  # OAuth Configuration
  oauth:
    enabled: true
    client_id: "${OAUTH_CLIENT_ID}"
    client_secret: "${OAUTH_CLIENT_SECRET}"
    redirect_uri: "https://staging.paas-platform.com/auth/callback"
    
  # WAF Configuration
  waf:
    enabled: true
    rate_limit: 1000
    ip_whitelist: []
    
  # SSL/TLS Configuration
  tls:
    min_version: "1.2"
    cipher_suites: ["ECDHE-RSA-AES256-GCM-SHA384", "ECDHE-RSA-AES128-GCM-SHA256"]

# Plugin System Configuration
plugins:
  enabled: true
  sandbox_enabled: true
  max_plugins: 100
  plugin_timeout_seconds: 60
  
  # Resource limits for plugins
  resource_limits:
    max_memory_mb: 512
    max_cpu_time_seconds: 30
    max_file_descriptors: 100
    max_processes: 5
    max_file_size_mb: 100
    
  # Plugin marketplace
  marketplace:
    enabled: true
    auto_updates: false
    security_scanning: true

# AI/ML Configuration
ai:
  enabled: true
  mock_mode: false
  
  # Model configuration
  models:
    scaling_predictor:
      enabled: true
      confidence_threshold: 0.8
      retrain_interval_hours: 12
      model_version: "v1.2"
      
    anomaly_detector:
      enabled: true
      sensitivity: 0.85
      window_size_minutes: 10
      alert_threshold: 0.9
      
    cost_optimizer:
      enabled: true
      optimization_interval_hours: 4
      savings_threshold: 0.05
      
    performance_predictor:
      enabled: true
      prediction_horizon_hours: 24
      accuracy_threshold: 0.9

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  
  # CORS configuration
  cors:
    enabled: true
    allow_origins: ["https://staging.paas-platform.com"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
    allow_headers: ["Authorization", "Content-Type"]
  
  # Rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 500
    burst_limit: 100
    
  # API versioning
  versioning:
    default_version: "v1"
    supported_versions: ["v1"]

# CLI Configuration
cli:
  default_environment: "staging"
  auto_completion: true
  colored_output: true
  verbose: false

# Deployment Configuration
deployment:
  strategy: "blue_green"
  health_check_timeout: 120
  rollback_enabled: true
  
  # Blue/Green deployment settings
  blue_green:
    enabled: true
    traffic_shift_percentage: 25
    monitoring_duration_minutes: 10
    auto_rollback: true
    
  # Health checks
  health_checks:
    startup_probe_delay: 30
    readiness_probe_interval: 10
    liveness_probe_interval: 30

# Notification Configuration
notifications:
  enabled: true
  
  channels:
    email:
      enabled: true
      smtp_server: "${SMTP_SERVER}"
      smtp_port: 587
      username: "${SMTP_USERNAME}"
      password: "${SMTP_PASSWORD}"
      
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channel: "#paas-staging-alerts"
      
    webhook:
      enabled: true
      url: "${WEBHOOK_URL}"
      timeout_seconds: 10

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  
  # Database backup
  database:
    enabled: true
    compression: true
    encryption: true
    
  # File storage backup
  storage:
    enabled: true
    incremental: true

# Compliance Configuration
compliance:
  gdpr:
    enabled: true
    data_retention_days: 365
    anonymization: true
    
  hipaa:
    enabled: false
    
  soc2:
    enabled: true
    audit_logging: true
    access_controls: true

# Performance Configuration
performance:
  caching:
    enabled: true
    ttl_seconds: 300
    max_size_mb: 1024
    
  compression:
    enabled: true
    algorithms: ["gzip", "br"]
    
  cdn:
    enabled: true
    cache_control: "public, max-age=3600"

# Load Testing Configuration
load_testing:
  enabled: true
  max_concurrent_users: 1000
  ramp_up_duration: 300  # 5 minutes
  test_duration: 1800    # 30 minutes
  
# Disaster Recovery
disaster_recovery:
  enabled: true
  rto_minutes: 60  # Recovery Time Objective
  rpo_minutes: 15  # Recovery Point Objective
  
  # Multi-region setup
  regions:
    primary: "us-east-1"
    secondary: "us-west-2"
    
  # Failover configuration
  failover:
    automatic: false
    health_check_interval: 60
