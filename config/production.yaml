# Production Environment Configuration
# AI-Native PaaS Platform

platform:
  name: "AI-Native PaaS"
  version: "1.0.0"
  environment: "production"
  debug: false
  log_level: "WARNING"

# Database Configuration
database:
  url: "${DATABASE_URL}"
  pool_size: 50
  max_overflow: 100
  echo: false
  ssl_mode: "require"
  
  # Connection pooling
  pool_timeout: 30
  pool_recycle: 3600
  
  # Read replicas
  read_replicas:
    enabled: true
    urls: ["${DATABASE_READ_REPLICA_1}", "${DATABASE_READ_REPLICA_2}"]

# Redis Configuration
redis:
  url: "${REDIS_URL}"
  max_connections: 100
  decode_responses: true
  ssl: true
  
  # Redis Cluster
  cluster:
    enabled: true
    nodes: ["${REDIS_NODE_1}", "${REDIS_NODE_2}", "${REDIS_NODE_3}"]

# AWS Configuration
aws:
  region: "${AWS_REGION}"
  account_id: "${AWS_ACCOUNT_ID}"
  mock_mode: false
  
  # ECS Configuration
  ecs:
    cluster_name: "paas-production-cluster"
    task_definition_family: "paas-production-app"
    service_name_prefix: "paas-prod"
    cpu: 4096
    memory: 8192
    desired_count: 10
    
  # DynamoDB Configuration
  dynamodb:
    table_prefix: "paas-prod"
    billing_mode: "PROVISIONED"
    read_capacity: 1000
    write_capacity: 500
    point_in_time_recovery: true
    global_tables: true
    
  # S3 Configuration
  s3:
    bucket_name: "paas-production-storage"
    versioning: true
    encryption: true
    mfa_delete: true
    cross_region_replication: true
    
  # SageMaker Configuration
  sagemaker:
    endpoint_scaling: "paas-prod-scaling-predictor"
    endpoint_anomaly: "paas-prod-anomaly-detector"
    endpoint_cost: "paas-prod-cost-optimizer"
    instance_type: "ml.c5.2xlarge"
    auto_scaling: true
    
  # CloudWatch Configuration
  cloudwatch:
    detailed_monitoring: true
    custom_metrics: true
    log_retention_days: 90

# Scaling Configuration
scaling:
  strategy: "predictive"
  min_instances: 5
  max_instances: 1000
  ai_confidence_threshold: 0.9
  scale_up_cooldown: 120  # 2 minutes
  scale_down_cooldown: 180  # 3 minutes
  
  # Metrics thresholds
  cpu_threshold_up: 80.0
  cpu_threshold_down: 20.0
  memory_threshold_up: 90.0
  memory_threshold_down: 30.0
  
  # Predictive scaling
  prediction_window_minutes: 60
  historical_data_days: 30
  
  # Multi-dimensional scaling
  custom_metrics:
    - name: "request_queue_length"
      threshold_up: 100
      threshold_down: 10
    - name: "database_connections"
      threshold_up: 80
      threshold_down: 20

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_retention_days: 365
  anomaly_detection_enabled: true
  alerting_enabled: true
  
  # Metrics collection interval
  collection_interval_seconds: 15
  
  # Dashboard configuration
  dashboards:
    enabled: true
    refresh_interval: 5
    
  # Alerting thresholds
  alerts:
    error_rate_threshold: 1.0
    response_time_threshold: 1000  # 1 second
    memory_usage_threshold: 95.0
    cpu_usage_threshold: 90.0
    disk_usage_threshold: 85.0
    
  # SLA monitoring
  sla:
    uptime_target: 99.9
    response_time_target: 500  # 500ms
    error_rate_target: 0.1

# Security Configuration
security:
  encryption_at_rest: true
  encryption_in_transit: true
  rbac_enabled: true
  audit_logging: true
  
  # JWT Configuration
  jwt:
    secret_key: "${JWT_SECRET_KEY}"
    algorithm: "RS256"  # Use RSA for production
    expiration_hours: 1
    refresh_token_hours: 168  # 7 days
    
  # OAuth Configuration
  oauth:
    enabled: true
    client_id: "${OAUTH_CLIENT_ID}"
    client_secret: "${OAUTH_CLIENT_SECRET}"
    redirect_uri: "https://paas-platform.com/auth/callback"
    
  # WAF Configuration
  waf:
    enabled: true
    rate_limit: 10000
    ip_whitelist: []
    geo_blocking: ["CN", "RU"]  # Block certain countries
    
  # SSL/TLS Configuration
  tls:
    min_version: "1.3"
    cipher_suites: ["TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256"]
    hsts_enabled: true
    
  # Network Security
  network:
    vpc_flow_logs: true
    security_groups_strict: true
    nacl_enabled: true
    
  # Secrets Management
  secrets:
    rotation_enabled: true
    rotation_interval_days: 90
    encryption_key_rotation: true

# Plugin System Configuration
plugins:
  enabled: true
  sandbox_enabled: true
  max_plugins: 500
  plugin_timeout_seconds: 120
  
  # Resource limits for plugins
  resource_limits:
    max_memory_mb: 1024
    max_cpu_time_seconds: 60
    max_file_descriptors: 200
    max_processes: 10
    max_file_size_mb: 500
    
  # Plugin marketplace
  marketplace:
    enabled: true
    auto_updates: false
    security_scanning: true
    code_signing_required: true
    
  # Plugin isolation
  isolation:
    network_isolation: true
    filesystem_isolation: true
    process_isolation: true

# AI/ML Configuration
ai:
  enabled: true
  mock_mode: false
  
  # Model configuration
  models:
    scaling_predictor:
      enabled: true
      confidence_threshold: 0.95
      retrain_interval_hours: 6
      model_version: "v2.1"
      a_b_testing: true
      
    anomaly_detector:
      enabled: true
      sensitivity: 0.95
      window_size_minutes: 5
      alert_threshold: 0.95
      ensemble_models: true
      
    cost_optimizer:
      enabled: true
      optimization_interval_hours: 1
      savings_threshold: 0.01
      spot_instance_optimization: true
      
    performance_predictor:
      enabled: true
      prediction_horizon_hours: 72
      accuracy_threshold: 0.95
      
    user_behavior_analyzer:
      enabled: true
      segmentation: true
      personalization: true
      
  # Model monitoring
  model_monitoring:
    drift_detection: true
    performance_tracking: true
    bias_detection: true
    explainability: true

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 16
  reload: false
  
  # CORS configuration
  cors:
    enabled: true
    allow_origins: ["https://paas-platform.com", "https://app.paas-platform.com"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
    allow_headers: ["Authorization", "Content-Type", "X-API-Key"]
  
  # Rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 10000
    burst_limit: 1000
    per_user_limit: 1000
    
  # API versioning
  versioning:
    default_version: "v1"
    supported_versions: ["v1", "v2"]
    deprecation_warnings: true
    
  # API Gateway
  gateway:
    enabled: true
    throttling: true
    caching: true
    request_validation: true

# CLI Configuration
cli:
  default_environment: "production"
  auto_completion: true
  colored_output: false
  verbose: false
  telemetry: true

# Deployment Configuration
deployment:
  strategy: "blue_green"
  health_check_timeout: 300
  rollback_enabled: true
  
  # Blue/Green deployment settings
  blue_green:
    enabled: true
    traffic_shift_percentage: 10
    monitoring_duration_minutes: 30
    auto_rollback: true
    canary_analysis: true
    
  # Health checks
  health_checks:
    startup_probe_delay: 60
    readiness_probe_interval: 5
    liveness_probe_interval: 10
    
  # Multi-region deployment
  multi_region:
    enabled: true
    regions: ["us-east-1", "us-west-2", "eu-west-1"]
    traffic_distribution: [50, 30, 20]

# Notification Configuration
notifications:
  enabled: true
  
  channels:
    email:
      enabled: true
      smtp_server: "${SMTP_SERVER}"
      smtp_port: 587
      username: "${SMTP_USERNAME}"
      password: "${SMTP_PASSWORD}"
      tls: true
      
    slack:
      enabled: true
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channel: "#paas-production-alerts"
      
    pagerduty:
      enabled: true
      integration_key: "${PAGERDUTY_INTEGRATION_KEY}"
      
    webhook:
      enabled: true
      url: "${WEBHOOK_URL}"
      timeout_seconds: 5
      retry_attempts: 3

# Backup Configuration
backup:
  enabled: true
  schedule: "0 1 * * *"  # Daily at 1 AM
  retention_days: 365
  
  # Database backup
  database:
    enabled: true
    compression: true
    encryption: true
    cross_region_backup: true
    
  # File storage backup
  storage:
    enabled: true
    incremental: true
    versioning: true
    
  # Disaster recovery testing
  dr_testing:
    enabled: true
    schedule: "0 2 * * 0"  # Weekly on Sunday

# Compliance Configuration
compliance:
  gdpr:
    enabled: true
    data_retention_days: 2555  # 7 years
    anonymization: true
    right_to_be_forgotten: true
    
  hipaa:
    enabled: true
    encryption_required: true
    access_logging: true
    
  soc2:
    enabled: true
    audit_logging: true
    access_controls: true
    change_management: true
    
  pci_dss:
    enabled: false  # Enable if handling payment data

# Performance Configuration
performance:
  caching:
    enabled: true
    ttl_seconds: 3600
    max_size_mb: 10240  # 10GB
    distributed: true
    
  compression:
    enabled: true
    algorithms: ["br", "gzip"]
    level: 6
    
  cdn:
    enabled: true
    cache_control: "public, max-age=86400"
    edge_locations: ["us", "eu", "ap"]
    
  # Database optimization
  database_optimization:
    connection_pooling: true
    query_optimization: true
    index_optimization: true
    partitioning: true

# Cost Optimization
cost_optimization:
  enabled: true
  
  # Reserved instances
  reserved_instances:
    enabled: true
    utilization_target: 80
    
  # Spot instances
  spot_instances:
    enabled: true
    max_percentage: 70
    diversification: true
    
  # Resource rightsizing
  rightsizing:
    enabled: true
    analysis_interval_hours: 24
    recommendation_threshold: 0.2

# Business Intelligence
business_intelligence:
  enabled: true
  
  # Analytics
  analytics:
    user_behavior: true
    performance_metrics: true
    cost_analysis: true
    revenue_tracking: true
    
  # Reporting
  reporting:
    automated_reports: true
    schedule: "0 8 * * 1"  # Weekly on Monday
    recipients: ["${BI_REPORT_RECIPIENTS}"]

# Disaster Recovery
disaster_recovery:
  enabled: true
  rto_minutes: 15  # Recovery Time Objective
  rpo_minutes: 5   # Recovery Point Objective
  
  # Multi-region setup
  regions:
    primary: "us-east-1"
    secondary: "us-west-2"
    tertiary: "eu-west-1"
    
  # Failover configuration
  failover:
    automatic: true
    health_check_interval: 30
    
  # Data replication
  replication:
    synchronous: true
    lag_threshold_seconds: 10
